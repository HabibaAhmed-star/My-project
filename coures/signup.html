<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>signup-patternist</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <form action="index.html" method="post" novalidate >
        <nav>
            <h1>signup</h1>
        </nav>
        <div>
            <label for="Full Name"><b>Full Name</b></label>
            <input type="text" id="fullname" name="fullname" placeholder="Write your full name" required><br><br>
        </div>
        <div>
            <label for="email"><b>Email:</b></label>
            <input type="email" name="mail" placeholder="Write vaild email" required><br><br>
        </div>
        <div>
            <label for="date"><b>Date of Birth:</b></label>
            <input type="date" id="dob" name="date" required><br><br>
        </div>
        <div>
            <label for="password"><b>Password:</b></label>
            <input type="password" id="password" name="password" placeholder="Write complex password" required><br><br>
        </div>
        <div>
            <label for="confirm_password"><b>Confirm Password:</b></label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required><br><br>
        </div>
        <div>
            <table>
                <tr>
                    <td><label for="phone"><b>Phone:</b></label>
                        <input type="tel" id="phone" name="phone" min="1" max="100" step="1" placeholder="Write your phone number" required><br><br></td>
                    <td><label for="country"><b>Country:</b></label>
                        <select id="country" name="country" required>
                            <option value="">Select your country</option>
                            <option value="usa">USA</option>
                            <option value="canada">Canada</option>
                            <option value="uk">UK</option>
                            <option value="australia">Australia</option> 
                            <option value="india">India</option>
                            <option value="egypt">Egypt</option>
                        </select><br><br></td>
                    </tr>
            </table>
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male"><b>Male</b></label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female"><b>Female</b></label><br><br>
        </div> 
        <div>
            <input type="checkbox" id="remember_me" name="remember_me">
            <label for="remember_me"><b>Remember me</b></label><br><br>
        </div>
        <div>
            <input type="submit" value="Signup">
        </div>
    </form>
</body>
</html>
