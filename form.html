<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Order</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <nav class="navbar" >
                <ul>
                    <li class="logo-group">
                        <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 15 C35 15 30 35 35 50 C25 45 15 50 15 60 C15 75 30 85 50 85 C70 85 85 75 85 60 C85 50 75 45 65 50 C70 35 65 15 50 15 Z" 
                            fill="currentColor"/>
                            <rect x="47" y="80" width="6" height="15" fill="currentColor"/>
                        </svg>
                        <a href="index.html" class="logo-link">
                            <h3>YOUR WEDDING PHOTOGRAPHER</h3>
                        </a>
                    </li>
                    <li class="nav-icons">
                        <a href="#"><i class="fa-solid fa-location-dot"></i></a>
                        <a href="#"><i class="fa-solid fa-envelope"></i></a>
                        <a href="#"><i class="fa-solid fa-phone"></i></a>
                    </li>
                </ul>
            </nav>

    <div class="order-header">
        <h2>COMPLETE YOUR ORDER</h2>
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>


    <div class="checkout-container">
        <div class="checkout-form-section">
            <div class="checkout-tabs">
                <button class="tab-btn active"><i class="fa-solid fa-circle-info"></i> Enter your info</button>
                <button class="tab-btn"><i class="fa-solid fa-truck"></i> Delivery Options</button>
                <button class="tab-btn"><i class="fa-solid fa-credit-card"></i> Payment</button>
            </div>
            <form action="#" method="POST">
                <div class="form-group error">
                    <input type="email" placeholder="Email *" required>
                    
                </div>

                
                <div class="form-row">
                    <div class="form-group error">
                        <input type="text" placeholder="First Name *" required>
                    
                    </div>
                    <div class="form-group error">
                        <input type="text" placeholder="Last Name *" required>
                        
                    </div>
                </div>

                <div class="form-group">
                    <select name="country">
                        <option value="Egypt">Egypt</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="France">France</option>
                    </select>
                </div>

                
                <div class="form-group error">
                    <input type="text" placeholder="Address *" required>
                    
                </div>

                
                <div class="form-row">
                    <div class="form-group error">
                        <input type="text" placeholder="City *" required>
                        
                    </div>
                    <div class="form-group error">
                        <input type="text" placeholder="Zip/Postal Code *" required>
                    </div>
                </div>
                <div >
                    <input type="submit" value="CONTINUE TO DELIVERY OPTIONS">
                </div>
            </form>
        </div>

        <div class="order-summary-section">
            <div class="summary-card">
                <a href="pricing.html" class="text-link">
                <h3>Advanced</h3>
                </a>
                <p class="quantity">Quantity: 1</p>
                <p class="summary-price">$350.00</p>
            </div>

            <div class="summary-totals">
                <div class="subtotal-row">
                    <span>Subtotal</span>
                    <span>$350.00</span>
                </div>
                <hr>
                <div class="total-row">
                    <span>Total</span>
                    <span>$350.00</span>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div>
            <a href="index.html#home">Home</a>
            <a href="index.html#pricing">pricing</a>
            <a href="index.html#contact">Contact</a>
        </div>
        <p class="footer-text">YOUR WEDDING PHOTOGRAPHER</p>
        <p>&copy; 2024 Your Wedding Photographer. All rights reserved.</p>

    </footer>

</body>
</html>
