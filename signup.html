<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>signup-patternist</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<div class="signup-container">
    
    <!-- 1. الجزء الأيسر: الصورة والعبارة الترحيبية -->
    <div class="signup-banner">
        <div class="banner-overlay">
            <h2>JOIN PATTERNIST</h2>
            <p>Craft your tailored pattern with precision and Parisian elegance.</p>
        </div>
    </div>

    <!-- 2. الجزء الأيمن: الفـورم -->
    <div class="signup-form-container">
        <h2>SIGNUP</h2>
        
        <form class="signup-form">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Write your full name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Write valid email" required>
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Write complex password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" required>
            </div>

            <!-- صف التليفون والدولة جنب بعض بشكل شيك -->
            <div class="input-row">
                <div class="input-group">
                    <label>Country</label>
                    <select>
                        <option value="" disabled selected>Select your country</option>
                        <option value="EG">Egypt</option>
                        <option value="FR">France</option>
                        <option value="US">United States</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Phone</label>
                    <input type="tel" placeholder="Write your phone number">
                </div>
            </div>

            <!-- الجندر وتذكرني -->
            <div class="options-row">
                <div class="gender-selection">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
                
                <div class="remember-me">
                    <label><input type="checkbox"> Remember me</label>
                </div>
            </div>

            <button type="submit" class="signup-btn">SIGNUP</button>
        </form>
    </div>

</div>
</body>
</html>
